# OpenCCU-Base continuous integration build workflow
# yamllint disable rule:truthy
---
name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Source builds require no write access to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build [${{ matrix.platform }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux-gnu
            debian_arch: amd64
            multiarch_triplet: x86_64-linux-gnu
            binary_format: x86-64
            build_assets: 'ON'
          - platform: aarch64-linux-gnu
            debian_arch: arm64
            multiarch_triplet: aarch64-linux-gnu
            binary_format: ARM aarch64
            build_assets: 'OFF'
          - platform: arm-linux-gnueabihf
            debian_arch: armhf
            multiarch_triplet: arm-linux-gnueabihf
            binary_format: ARM
            build_assets: 'OFF'
          - platform: i686-linux-gnu
            debian_arch: i386
            multiarch_triplet: i386-linux-gnu
            binary_format: Intel 80386
            build_assets: 'OFF'

    steps:
      - name: Checkout Code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure and build
        env:
          BUILD_ASSETS: ${{ matrix.build_assets }}
          DEBIAN_ARCH: ${{ matrix.debian_arch }}
          MULTIARCH_TRIPLET: ${{ matrix.multiarch_triplet }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env BUILD_ASSETS \
            --env DEBIAN_ARCH \
            --env MULTIARCH_TRIPLET \
            --env TARGET_PLATFORM \
            debian:bookworm-slim \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              export LANG=C.UTF-8

              package_arch=""
              toolchain_packages=(build-essential)
              case "${TARGET_PLATFORM}" in
                x86_64-linux-gnu)
                  ;;
                aarch64-linux-gnu)
                  package_arch=":${DEBIAN_ARCH}"
                  toolchain_packages=(
                    gcc-aarch64-linux-gnu
                    g++-aarch64-linux-gnu
                    libc6-dev-arm64-cross
                  )
                  ;;
                arm-linux-gnueabihf)
                  package_arch=":${DEBIAN_ARCH}"
                  toolchain_packages=(
                    gcc-arm-linux-gnueabihf
                    g++-arm-linux-gnueabihf
                    libc6-dev-armhf-cross
                  )
                  ;;
                i686-linux-gnu)
                  package_arch=":${DEBIAN_ARCH}"
                  toolchain_packages=(
                    gcc-i686-linux-gnu
                    g++-i686-linux-gnu
                    libc6-dev-i386-cross
                  )
                  ;;
                *)
                  echo "Unsupported target platform: ${TARGET_PLATFORM}" >&2
                  exit 1
                  ;;
              esac

              if [ -n "${package_arch}" ]; then
                dpkg --add-architecture "${DEBIAN_ARCH}"
              fi

              apt-get update
              packages=(
                ca-certificates
                cmake
                file
                "libssl-dev${package_arch}"
                "libusb-1.0-0-dev${package_arch}"
                make
                pkg-config
                "tcl-dev${package_arch}"
                "${toolchain_packages[@]}"
              )
              if [ "${BUILD_ASSETS}" = "ON" ]; then
                packages+=(default-jre-headless python3)
              fi
              apt-get install --yes --no-install-recommends "${packages[@]}"

              if [ -n "${package_arch}" ]; then
                export PKG_CONFIG_PATH=
                export PKG_CONFIG_LIBDIR="/usr/lib/${MULTIARCH_TRIPLET}"
                PKG_CONFIG_LIBDIR="${PKG_CONFIG_LIBDIR}/pkgconfig"
                PKG_CONFIG_LIBDIR="${PKG_CONFIG_LIBDIR}:/usr/share/pkgconfig"
              fi

              if [ "${TARGET_PLATFORM}" = "x86_64-linux-gnu" ]; then
                python3 tests/test-components.py -v
              fi

              # Read Tcl paths from the target container. Preset search roots
              # may exclude its native multiarch library directory.
              tcl_include="$(pkg-config --variable=includedir tcl)"
              tcl_libdir="$(pkg-config --variable=libdir tcl)"
              test -f "${tcl_include}/tcl.h"
              test -f "${tcl_libdir}/libtcl.so"
              echo "Tcl headers: ${tcl_include}"
              echo "Tcl library: ${tcl_libdir}/libtcl.so"

              cmake --preset "${TARGET_PLATFORM}" \
                -DDEPLOY_TO_REPO=OFF \
                -DBUILD_TCL_MODULES=ON \
                -DTCL_INCLUDE_PATH="${tcl_include}" \
                -DTCL_LIBRARY="${tcl_libdir}/libtcl.so" \
                -DHAS_USB_SUPPORT=ON \
                -DBUILD_WEBUI_AND_DEVICETYPES="${BUILD_ASSETS}"
              cmake --build --preset "${TARGET_PLATFORM}" \
                --target package \
                --parallel "$(nproc)"
            '

      - name: Verify staged package
        env:
          BINARY_FORMAT: ${{ matrix.binary_format }}
          BUILD_ASSETS: ${{ matrix.build_assets }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          stage="build/${TARGET_PLATFORM}/rootfs"

          for artifact in \
            bin/SetInterfaceClock \
            bin/crypttool \
            bin/eq3configcmd \
            bin/eq3configd \
            bin/hs485d \
            bin/hs485dLoader \
            bin/hss_led \
            bin/multimacd \
            bin/rfd \
            bin/ssdpd \
            lib/libLanDeviceUtils.so \
            lib/libUnifiedLanComm.so \
            lib/libXmlRpc.so \
            lib/libelvutils.so \
            lib/libeq3config.so \
            lib/libhsscomm.so \
            lib/libxmlparser.so \
            lib/tclrega.so \
            lib/tclrpc.so \
            opt/HMServer/HMServer.jar; do
            test -s "${stage}/${artifact}"
          done

          for artifact in bin/rfd lib/tclrega.so; do
            description=$(file "${stage}/${artifact}")
            echo "${description}"
            grep --fixed-strings "${BINARY_FORMAT}" \
              <<<"${description}" >/dev/null
          done

          if [ "${BUILD_ASSETS}" = "ON" ]; then
            test -s "${stage}/www/webui/webui.js"
            test -s "${stage}/www/webui/style.css"
            test -s "${stage}/www/config/devdescr/DEVDB.tcl"

            source_rf_count=$(find src/devicetypes/rftypes \
              -maxdepth 1 -name '*.xml' | wc -l)
            staged_rf_count=$(find "${stage}/firmware/rftypes" \
              -maxdepth 1 -name '*.xml' | wc -l)
            source_hs485_count=$(find src/devicetypes/hs485types \
              -maxdepth 1 -name '*.xml' | wc -l)
            staged_hs485_count=$(find "${stage}/firmware/hs485types" \
              -maxdepth 1 -name '*.xml' | wc -l)
            test "${source_rf_count}" -eq "${staged_rf_count}"
            test "${source_hs485_count}" -eq "${staged_hs485_count}"
          fi
