# OpenCCU-Base continuous integration build workflow
# yamllint disable rule:truthy
---
name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Source builds require no write access to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build [${{ matrix.platform }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux-gnu
            foreign_arch: ''
            multiarch_triplet: x86_64-linux-gnu
            cross_prefix: ''
            binary_format: x86-64
            build_assets: 'ON'
          - platform: aarch64-linux-gnu
            foreign_arch: arm64
            multiarch_triplet: aarch64-linux-gnu
            cross_prefix: aarch64-linux-gnu-
            binary_format: ARM aarch64
            build_assets: 'OFF'
          - platform: arm-linux-gnueabihf
            foreign_arch: armhf
            multiarch_triplet: arm-linux-gnueabihf
            cross_prefix: arm-linux-gnueabihf-
            binary_format: ARM
            build_assets: 'OFF'
          - platform: i686-linux-gnu
            foreign_arch: i386
            multiarch_triplet: i386-linux-gnu
            cross_prefix: i686-linux-gnu-
            binary_format: Intel 80386
            build_assets: 'OFF'

    steps:
      - name: Checkout Code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install build dependencies
        env:
          BUILD_ASSETS: ${{ matrix.build_assets }}
          FOREIGN_ARCH: ${{ matrix.foreign_arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          if [ -n "${FOREIGN_ARCH}" ]; then
            sudo dpkg --add-architecture "${FOREIGN_ARCH}"
            sudo apt-get update
          fi

          packages=(
            build-essential
            ca-certificates
            cmake
            file
            libssl-dev
            libusb-1.0-0-dev
            pkg-config
            tcl-dev
          )

          if [ "${BUILD_ASSETS}" = "ON" ]; then
            packages+=(python3)
          fi

          if [ -n "${FOREIGN_ARCH}" ]; then
            packages+=(
              "gcc-${TARGET_PLATFORM}"
              "g++-${TARGET_PLATFORM}"
              "libc6-dev:${FOREIGN_ARCH}"
              "libssl-dev:${FOREIGN_ARCH}"
              "libusb-1.0-0-dev:${FOREIGN_ARCH}"
              "tcl-dev:${FOREIGN_ARCH}"
            )
          fi

          sudo apt-get install --yes --no-install-recommends "${packages[@]}"

      - name: Configure and build
        env:
          BUILD_ASSETS: ${{ matrix.build_assets }}
          CROSS_PREFIX: ${{ matrix.cross_prefix }}
          MULTIARCH_TRIPLET: ${{ matrix.multiarch_triplet }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail
          export LANG=C.UTF-8
          export PKG_CONFIG_DIR=
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="/usr/lib/${MULTIARCH_TRIPLET}/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR=/
          if [ -n "${CROSS_PREFIX}" ]; then
            export CC="${CROSS_PREFIX}gcc"
            export CXX="${CROSS_PREFIX}g++"
          fi

          cmake --preset "${TARGET_PLATFORM}" \
            -DDEPLOY_TO_REPO=OFF \
            -DBUILD_TCL_MODULES=ON \
            -DHAS_USB_SUPPORT=ON \
            -DBUILD_WEBUI_AND_DEVICETYPES="${BUILD_ASSETS}"
          cmake --build --preset "${TARGET_PLATFORM}" \
            --target package \
            --parallel "$(nproc)"

      - name: Cross-build safeguard
        env:
          CROSS_PREFIX: ${{ matrix.cross_prefix }}
          MULTIARCH_TRIPLET: ${{ matrix.multiarch_triplet }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail
          compiler="${CROSS_PREFIX}gcc"
          linker="${CROSS_PREFIX}ld"
          command -v "${compiler}"
          command -v "${linker}"
          "${compiler}" -dumpmachine
          "${compiler}" -print-sysroot || true
          "${linker}" --version | head -n 1

          export PKG_CONFIG_DIR=
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="/usr/lib/${MULTIARCH_TRIPLET}/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR=/
          pkg-config --debug --libs openssl 2>&1 | tail -n 20
          pkg-config --debug --libs libusb-1.0 2>&1 | tail -n 20
          pkg-config --debug --libs tcl 2>&1 | tail -n 20 || true

          cache="build/${TARGET_PLATFORM}/CMakeCache.txt"
          grep -E '^(CMAKE_(C|CXX)_COMPILER:FILEPATH|OPENSSL_(SSL|CRYPTO)_LIBRARY:FILEPATH|TCL_LIBRARY:FILEPATH)' "${cache}" || true

          stage="build/${TARGET_PLATFORM}/rootfs"
          readelf -h "${stage}/bin/rfd" | grep --fixed-strings 'Machine:'
          readelf -d "${stage}/bin/rfd" | grep --fixed-strings '(NEEDED)' | head -n 20

      - name: Verify staged package
        env:
          BINARY_FORMAT: ${{ matrix.binary_format }}
          BUILD_ASSETS: ${{ matrix.build_assets }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          stage="build/${TARGET_PLATFORM}/rootfs"

          for artifact in \
            bin/SetInterfaceClock \
            bin/crypttool \
            bin/eq3configcmd \
            bin/eq3configd \
            bin/hs485d \
            bin/hs485dLoader \
            bin/hss_led \
            bin/multimacd \
            bin/rfd \
            bin/ssdpd \
            lib/libLanDeviceUtils.so \
            lib/libUnifiedLanComm.so \
            lib/libXmlRpc.so \
            lib/libelvutils.so \
            lib/libeq3config.so \
            lib/libhsscomm.so \
            lib/libxmlparser.so \
            lib/tclrega.so \
            lib/tclrpc.so \
            opt/HMServer/HMServer.jar; do
            test -s "${stage}/${artifact}"
          done

          for artifact in bin/rfd lib/tclrega.so; do
            description=$(file "${stage}/${artifact}")
            echo "${description}"
            grep --fixed-strings "${BINARY_FORMAT}" \
              <<<"${description}" >/dev/null
          done

          if [ "${BUILD_ASSETS}" = "ON" ]; then
            test -s "${stage}/www/webui/webui.js"
            test -s "${stage}/www/webui/style.css"
            test -s "${stage}/www/config/devdescr/DEVDB.tcl"

            source_rf_count=$(find src/devicetypes/rftypes \
              -maxdepth 1 -name '*.xml' | wc -l)
            staged_rf_count=$(find "${stage}/firmware/rftypes" \
              -maxdepth 1 -name '*.xml' | wc -l)
            source_hs485_count=$(find src/devicetypes/hs485types \
              -maxdepth 1 -name '*.xml' | wc -l)
            staged_hs485_count=$(find "${stage}/firmware/hs485types" \
              -maxdepth 1 -name '*.xml' | wc -l)
            test "${source_rf_count}" -eq "${staged_rf_count}"
            test "${source_hs485_count}" -eq "${staged_hs485_count}"
          fi
