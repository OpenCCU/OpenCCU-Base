# Rebuilds the CodeMirror 6 bundle of the WebUI script editor
# (src/webui/www/webui/js/extern/codemirror6) with scripts/update-codemirror.sh
# when npm has new releases of the bundled packages and opens a pull request
# with the result.
#
# The rebuild runs downloaded npm packages, so it runs in its own job with a
# read-only token; only the bundle files are handed to the job that commits
# them and opens the pull request from a fresh checkout.
# yamllint disable rule:truthy
---
name: Update CodeMirror

on:
  schedule:
    - cron: '17 3 * * 1'  # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if no bundled package has a new version'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-codemirror
  cancel-in-progress: false

env:
  BUNDLE_DIR: src/webui/www/webui/js/extern/codemirror6

jobs:
  build:
    name: Rebuild the CodeMirror bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rebuild the bundle
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: ./scripts/update-codemirror.sh

      - name: Check for a changed bundle
        id: changes
        run: |
          if git diff --quiet -- "${BUNDLE_DIR}"; then
            echo "The CodeMirror bundle is already up to date."
            echo "changed=false" >>"${GITHUB_OUTPUT}"
          else
            echo "changed=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Upload the bundle
        if: steps.changes.outputs.changed == 'true'
        # v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codemirror6-bundle
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open the pull request
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the bundle
        # v8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: codemirror6-bundle
          path: ${{ env.BUNDLE_DIR }}

      - name: Open a pull request for the new bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^CODEMIRROR6_VERSION = (.*)$/\1/p' "${BUNDLE_DIR}/VERSION" | head -n1)
          if [[ -z "${version}" ]]; then
            echo "::error::Failed to read the CodeMirror version from ${BUNDLE_DIR}/VERSION"
            exit 1
          fi

          # One branch per bundle content (packages and built files): a rebuild
          # with the same result leaves an existing branch, and any commits
          # added to it, alone instead of overwriting it.
          bundle_id=$(cat <(grep '^PACKAGE ' "${BUNDLE_DIR}/VERSION") \
            "${BUNDLE_DIR}/codemirror6.bundle.js" "${BUNDLE_DIR}/codemirror6.bundle.css" \
            | sha256sum | cut -c1-12)
          branch="ci/update-codemirror-${bundle_id}"
          title="webui: update the CodeMirror bundle (codemirror ${version})"
          changes=$(git diff -U0 -- "${BUNDLE_DIR}/VERSION" | grep -E '^[-+]PACKAGE ' || true)

          gh auth setup-git
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            echo "Branch ${branch} already exists, not overwriting it."
            exit 0
          fi

          git config user.name "Jens Maus"
          git config user.email "mail@jens-maus.de"

          git switch -c "${branch}"
          git add "${BUNDLE_DIR}"
          git commit \
            -m "${title}" \
            -m "Rebuild the CodeMirror 6 bundle of the WebUI script editor with scripts/update-codemirror.sh (codemirror ${version})." \
            -m "Produced by the \"Update CodeMirror\" workflow."
          git push --set-upstream origin "${branch}"

          body=$(printf '%s\n\n```diff\n%s\n```\n\n%s\n' \
            "Automated rebuild of the CodeMirror 6 bundle of the WebUI script editor (\`${BUNDLE_DIR}\`) with \`scripts/update-codemirror.sh\` (codemirror \`${version}\`), triggered by workflow run \`${GITHUB_RUN_ID}\`. Changed packages:" \
            "${changes:-(none, forced rebuild)}" \
            "Before merging, test the script editor and add an entry to \`src/webui/CHANGELOG.md\`.")
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "${title}" \
            --body "${body}"
