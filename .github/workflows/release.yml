# OpenCCU-Base release draft
#
# Runs when a release pull request from the branch release/<tag> (created by
# the Release preparation workflow) is merged, or by hand. Creates the release
# draft <tag> on the merged commit; publishing the draft creates the tag.
# yamllint disable rule:truthy
---
name: Release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the new release (e.g. 3.89.12), created on the selected branch'
        required: true
        type: string
      previous_tag:
        description: 'Tag of the previous release (empty: the latest tag before the selected branch)'
        required: false
        type: string

# default read-only permission
permissions:
  contents: read

jobs:
  release_draft:
    permissions:
      contents: write  # ncipollo/release-action
    name: Release draft
    runs-on: ubuntu-24.04
    # by hand, or a merged release pull request of this repository
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Determine release
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            TAG=${HEAD_REF#release/}
            COMMIT=${MERGE_COMMIT}
          else
            TAG=${INPUT_TAG}
            COMMIT=${GITHUB_SHA}
          fi
          if [[ ! "${TAG}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Invalid release tag '${TAG}' (expected e.g. 3.89.12)."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # The built files of the release pull request were built from its
      # branch: if anything else was merged in between, the merged sources
      # differ from the built ones and the release has to be prepared again.
      - name: Check merged release pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          if [[ "$(git rev-parse refs/remotes/pull/head)" != "${HEAD_SHA}" ]]; then
            echo "::error::Head of pull request #${PR_NUMBER} is not ${HEAD_SHA}."
            exit 1
          fi
          if [[ "$(git rev-parse "${COMMIT}^{tree}")" != "$(git rev-parse "${HEAD_SHA}^{tree}")" ]]; then
            echo "::error::The merged commit ${COMMIT} differs from the release branch ${HEAD_SHA}: other changes were merged in between. Run the Release preparation workflow again and merge its pull request."
            git diff --stat "${HEAD_SHA}" "${COMMIT}"
            exit 1
          fi

      # The release action does not move an existing tag, and a published
      # release (also a prerelease) must not be changed: only a new tag, a tag
      # of the selected commit and a draft can be used.
      - name: Check release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          if TAG_COMMIT=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}"); then
            if [[ "${TAG_COMMIT}" != "${COMMIT}" ]]; then
              echo "::error::Tag ${TAG} points to ${TAG_COMMIT}, not to ${COMMIT}."
              exit 1
            fi
          fi
          PUBLISHED=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            | jq -r --arg tag "${TAG}" '.[] | select(.tag_name == $tag and .draft == false) | .id')
          if [[ -n "${PUBLISHED}" ]]; then
            echo "::error::Release ${TAG} is already published."
            exit 1
          fi

      - name: Determine previous release
        id: previous
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if [[ -z "${PREVIOUS_TAG}" ]]; then
            # the new tag may already exist on the selected commit
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*' \
              --exclude "${TAG}" HEAD)
          fi
          git rev-parse --verify --quiet "${PREVIOUS_TAG}^{commit}" >/dev/null
          echo "tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      # The component changelogs (src/<component>/CHANGELOG.md) come first,
      # followed by the list of pull requests generated by GitHub. GitHub
      # limits a release text to 125000 characters (124000 bytes are used,
      # a byte count is never below the character count). If both do not fit,
      # the list of pull requests is dropped, keeping its new contributors
      # and the link to the full changelog; then the migrated WebUI patches
      # and, if still needed, the largest components are replaced by a link
      # to their changelog.
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          BUDGET=124000
          NOTES="${RUNNER_TEMP}/release-notes.md"
          PULL_REQUESTS="${RUNNER_TEMP}/pull-requests.md"
          TAIL="${RUNNER_TEMP}/pull-requests-tail.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish="${COMMIT}" \
            -f previous_tag_name="${PREVIOUS_TAG}" --jq .body > "${PULL_REQUESTS}"
          # the tag only exists once the draft is published, so link the commit
          components() {
            python3 scripts/changelog-sections.py "$@" \
              --collapse "webui:Migrated from OpenCCU patches" \
              --link-base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${COMMIT}" \
              "${PREVIOUS_TAG}" HEAD
          }
          components > "${RUNNER_TEMP}/components.md"
          if [[ $(( $(wc -c < "${RUNNER_TEMP}/components.md") + 1
                    + $(wc -c < "${PULL_REQUESTS}") )) -le ${BUDGET} ]]; then
            { cat "${RUNNER_TEMP}/components.md"; echo; cat "${PULL_REQUESTS}"; } > "${NOTES}"
          else
            # "## New Contributors" (if any) and "**Full Changelog**: ..."
            sed -n '/^## New Contributors/,$p' "${PULL_REQUESTS}" > "${TAIL}"
            if [[ ! -s "${TAIL}" ]]; then
              grep '^\*\*Full Changelog\*\*' "${PULL_REQUESTS}" > "${TAIL}" || true
            fi
            if [[ ! -s "${TAIL}" ]]; then
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}" > "${TAIL}"
            fi
            LIMIT=$((BUDGET - 1 - $(wc -c < "${TAIL}")))
            { components --limit "${LIMIT}"; echo; cat "${TAIL}"; } > "${NOTES}"
          fi
          echo "Release notes: $(wc -c < "${NOTES}") bytes"
          cat "${NOTES}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create release draft
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.commit }}
          name: ${{ steps.release.outputs.tag }}
          bodyFile: ${{ runner.temp }}/release-notes.md
          draft: true
          prerelease: false
          allowUpdates: true
          updateOnlyUnreleased: true  # never turn a published release back into a draft
