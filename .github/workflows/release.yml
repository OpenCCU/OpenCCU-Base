# OpenCCU-Base release draft
# yamllint disable rule:truthy
---
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the new release (e.g. 3.89.12), created on the selected branch'
        required: true
        type: string
      previous_tag:
        description: 'Tag of the previous release (empty: the latest tag before the selected branch)'
        required: false
        type: string

# default read-only permission
permissions:
  contents: read

jobs:
  release_draft:
    permissions:
      contents: write  # ncipollo/release-action
    name: Release draft
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # The release action does not move an existing tag, and a published
      # release (also a prerelease) must not be changed: only a new tag, a tag
      # of the selected commit and a draft can be used.
      - name: Check release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if TAG_COMMIT=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}"); then
            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${TAG} points to ${TAG_COMMIT}, not to ${GITHUB_SHA}."
              exit 1
            fi
          fi
          PUBLISHED=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            | jq -r --arg tag "${TAG}" '.[] | select(.tag_name == $tag and .draft == false) | .id')
          if [[ -n "${PUBLISHED}" ]]; then
            echo "::error::Release ${TAG} is already published."
            exit 1
          fi

      - name: Determine previous release
        id: previous
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if [[ -z "${PREVIOUS_TAG}" ]]; then
            # the new tag may already exist on the selected commit
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*' \
              --exclude "${TAG}" HEAD)
          fi
          git rev-parse --verify --quiet "${PREVIOUS_TAG}^{commit}" >/dev/null
          echo "tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      # The component changelogs (src/<component>/CHANGELOG.md) come first,
      # followed by the list of pull requests generated by GitHub. GitHub
      # limits a release text to 125000 characters: components that do not
      # fit are replaced by a link to their changelog, and if the text is
      # still too long, the pull request list is replaced by a link to the
      # comparison of both releases.
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          PULL_REQUESTS="${RUNNER_TEMP}/pull-requests.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}" \
            -f previous_tag_name="${PREVIOUS_TAG}" --jq .body > "${PULL_REQUESTS}"
          # the tag only exists once the draft is published, so link the commit
          components() {
            python3 scripts/changelog-sections.py --limit "$1" \
              --link-base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}" \
              "${PREVIOUS_TAG}" HEAD
          }
          LIMIT=$((120000 - $(wc -c < "${PULL_REQUESTS}")))
          if [[ ${LIMIT} -ge 0 ]]; then
            { components "${LIMIT}"; echo; cat "${PULL_REQUESTS}"; } > "${NOTES}"
          fi
          if [[ ${LIMIT} -lt 0 || $(wc -c < "${NOTES}") -gt 125000 ]]; then
            {
              components 120000
              echo
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_SHA}"
            } > "${NOTES}"
          fi
          echo "Release notes: $(wc -c < "${NOTES}") characters"
          cat "${NOTES}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create release draft
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: ${{ inputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ inputs.tag }}
          bodyFile: ${{ runner.temp }}/release-notes.md
          draft: true
          prerelease: false
          allowUpdates: true
          updateOnlyUnreleased: true  # never turn a published release back into a draft
